services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bhumiguard
      POSTGRES_USER: bhumiguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bhumiguard -d bhumiguard"]
      interval: 5s
      retries: 10
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://bhumiguard:${POSTGRES_PASSWORD}@db:5432/bhumiguard
      DEMO_USERNAME: ${DEMO_USERNAME:-reviewer}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in .env}
      APP_ENV: local
      COOKIE_SECURE: "false"
      ALLOWED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    volumes:
      - documents:/app/runtime
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
  documents:
